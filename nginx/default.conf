# Cache policy is set with a map rather than per-location `add_header`, because
# an `add_header` inside a location silently drops every header inherited from
# the server block — including the security headers below.
map $uri $healthlog_cache {
    default                  "public, max-age=86400";
    "/"                      "no-cache";
    "/index.html"            "no-cache";
    "/sw.js"                 "no-cache";
    "/manifest.webmanifest"  "no-cache";
}

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset       utf-8;
    server_tokens off;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript image/svg+xml application/manifest+json;

    # index.html *is* the app and carries no content hash, and a cached service
    # worker pins an old version indefinitely. Both must revalidate; ETags make
    # that a cheap 304 rather than a re-download.
    add_header Cache-Control          $healthlog_cache always;
    add_header X-Content-Type-Options nosniff          always;
    add_header X-Frame-Options        SAMEORIGIN       always;
    add_header Referrer-Policy        no-referrer      always;

    location = /healthz {
        access_log   off;
        default_type text/plain;
        return       200 "ok\n";
    }

    # Not in nginx's default mime.types on most builds; without this the
    # manifest is served as octet-stream and the install prompt never appears.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
